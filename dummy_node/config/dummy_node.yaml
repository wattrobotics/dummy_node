# dummy_node 파라미터 기본값.
#
# 키가 `/dummy/dummy_node` 인 이유: 코어 노드가 코드에서 namespace="dummy" 로 생성되므로
# 완전한 노드 이름(FQN)이 `/dummy/dummy_node` 다. 파라미터 파일의 키는 FQN과 일치해야
# 적용되며, `dummy_node:` 만 쓰면 무시된다.
#
# 새 인터페이스가 파라미터를 추가할 때 이 파일에만 항목을 넣으면 되고,
# 런치 파일은 수정하지 않는다.
/dummy/dummy_node:
  ros__parameters:
    # --- robot_floor ---
    # 시작 층. 0층은 존재하지 않으므로 0을 넣으면 경고 후 1로 대체된다. 지하 1층 = -1.
    initial_floor: 1

    # --- person_presence ---
    # 시작 시 사람 인식 값. 런타임 변경은 /dummy/person_presence/set 서비스로 한다.
    initial_is_person: false
    # 사람 인식 발행 주기(초). 실기 인식 노드의 주기에 맞춰 조정한다.
    # (WaitNewTask.md §9 T1 - person_stale_ms 가 이 주기 확정 후 정해진다)
    person_presence_period_sec: 0.1

    # --- 공유: load_cell + tray_door ---
    # 적재함 단(tray) 개수. 0 = 상단. 두 인터페이스가 공유한다.
    tray_count: 2

    # --- load_cell (TakeParcelScreen.md §3.2) ---
    load_cell_period_sec: 0.1          # 로드셀 상태 발행 주기(초)
    initial_load_cell_occupied: false  # 시작 시 물건 감지 여부(전 tray)
    initial_load_cell_healthy: true    # 시작 시 로드셀 정상 여부(전 tray)
    # occupied 일 때 보고할 무게(g). weight_g 는 스펙상 진단용이며 BT 판정에
    # 쓰이지 않으므로, 별도 설정 수단 없이 occupied 로부터 파생시킨다.
    occupied_weight_g: 1000.0

    # --- tray_door (TakeParcelScreen.md §3.3) ---
    initial_doors_open: false          # 시작 시 문 열림 여부(전 tray)
    tray_door_state_period_sec: 0.2    # 문 상태 발행 주기(초)
    door_open_duration_sec: 2.0        # 열기 개시 -> 완전 열림까지 걸리는 시간
    door_close_duration_sec: 2.0       # 닫기 개시 -> 완전 닫힘까지 걸리는 시간
    # CloseTrayDoor 1회 goal 의 제한 시간. 끼임이 해소되지 않으면 이 시간에 걸려
    # ERROR_TIMEOUT 이 된다(force=true 로 계속 시도하는 경우).
    door_close_timeout_sec: 10.0

    # --- phidget_load_cell (실물 phidgets_hw 로드셀 모사, 절대 이름 /load_cell_state 등) ---
    # tray_count · load_cell_period_sec · initial_load_cell_* · occupied_weight_g 는 위의
    # load_cell 과 공유한다. 기동 직후의 변화 인지 상태 — 실물 기본값처럼 꺼짐(동결)으로
    # 시작한다. 켜기 전엔 물건을 놓아도 발행값이 바뀌지 않는다(BT 가 문을 열 때 켠다).
    tracking_on_startup: false

    # --- side_door (실물 w_swing_door_controller top/bottom 모사, 절대 이름) ---
    # 컨트롤러 이름. 인덱스 = tray (0=상단=top, 1=하단=bottom). /<이름>/command 액션과
    # /<이름>/status 토픽이 된다. 실기 기준(ScreenDoorDefaults.xml)이며 검증 리그에서는
    # top_door_controller 등으로 바꾼다.
    side_door_controllers: [side_door_top_controller, side_door_bottom_controller]
    side_door_status_period_sec: 0.1     # status 발행 주기(초). 실물은 50Hz, BT stale 판정은 3000ms
    # initial_doors_open · door_open_duration_sec(unlock·open) · door_close_duration_sec 는
    # 위의 tray_door 와 공유한다.
    side_door_goal_timeout_sec: 30.0     # goal 1회 상한(실물 기본값). 초과 시 ERROR_GOAL_TIMEOUT(21)
    # 끼임 후 재시도까지의 시간. 0 이면 재시도 없이 obstructed 에 머문다(goal_timeout 이 끊는다).
    side_door_obstruction_timeout_sec: 1.0
    # 끼임 재시도 상한. 소진하면 ERROR_OBSTRUCTION_RETRIES_EXHAUSTED(2).
    # 0 이면 첫 타임아웃에서 바로 error 다 — 끼임 시험이 1초 안에 끝난다.
    side_door_obstruction_max_retries: 0

    # --- notify (TakeParcelScreen.md §4.5) ---
    # true 면 기동 시부터 모든 알림 요청을 거부한다. 보고 실패 누적 경로를 시험할 때
    # 쓰며, 런타임에는 /dummy/notify/set_fail 서비스로 켜고 끈다.
    notify_fail: false

# ====================================================================== #
# 웹 제어 콘솔 (dummy_web). **별도 노드**이므로 키가 다르다.
# 브라우저에서 더미 상태를 보면서 클릭으로 제어한다. 내부 상태를 직접 만지지 않고
# 위 인터페이스들의 ROS 서비스·액션을 그대로 호출하므로, BT 가 쓰는 경로와 같은
# 경로가 검증된다.
# ====================================================================== #
/dummy/dummy_web:
  ros__parameters:
    # 접속 개방 범위. 0.0.0.0 = 같은 망의 다른 기기에서도 접속 가능(인증 없음).
    # 이 PC 에서만 쓰려면 127.0.0.1 로 바꾼다.
    web_host: "0.0.0.0"
    web_port: 8080
    # 희망 포트가 이미 쓰이고 있으면 다음 포트로 옮겨 연다(8080 -> 8081 -> ...).
    # 옮겨 열면 경고 로그로 실제 포트를 알린다. 1 로 두면 옮기지 않고 실패한다.
    web_port_max_tries: 10
    # 서비스 응답 대기 한도(초). 넘기면 화면에 시간 초과로 표시된다.
    service_timeout_sec: 5.0
    # 토픽을 받기 전 화면에 그릴 tray 칸 수. dummy_node 의 tray_count 와 맞춰 두면
    # 기동 직후 표시가 자연스럽다. 값이 어긋나도 첫 토픽 수신 시 배열 길이로 교정된다
    # (정본은 load_cell_state / tray_door/state 에 실린 배열 길이다).
    tray_count: 2
    # 실물 문 컨트롤러 이름(인덱스 = tray). status 구독과 command 액션 클라이언트를 이 이름으로
    # 만들므로 위 dummy_node 의 side_door_controllers 와 같아야 한다.
    side_door_controllers: [side_door_top_controller, side_door_bottom_controller]
